version: '3.8'

services:
  # --- Backend Service (Express + Node) ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: novacart_backend
    ports:
      - "5000:5000"
    # This links the .env file to the container securely
    env_file:
      - ./backend/.env
    restart: always
    networks:
      - novacart_network

  # --- Frontend Service (React + Nginx) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: novacart_frontend
    ports:
      - "80:80"
    # Ensures frontend only starts once backend is ready
    depends_on:
      - backend
    restart: always
    networks:
      - novacart_network

networks:
  novacart_network:
    driver: bridge